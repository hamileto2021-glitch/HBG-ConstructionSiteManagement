databases:
  - name: csm-postgres
    databaseName: csm_db
    user: csm_app
    region: oregon
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: csm-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./src/CSM.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: Database__Provider
        value: PostgreSQL
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: csm-postgres
          property: connectionString
      - key: Jwt__Issuer
        value: CSM.Api
      - key: Jwt__Audience
        value: CSM.Client
      - key: Jwt__SecretKey
        generateValue: true
      - key: CSM_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: web
    name: csm-web
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./src/CSM.Web/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: CSM_API_HOST
        fromService:
          name: csm-api
          type: web
          property: host
